# Primary local topology: classic Zookeeper-based Kafka.
#
# Pinned to Confluent Platform 7.7.x deliberately. Zookeeper mode was REMOVED in Kafka 4.0, so a
# cp-kafka:8.x image cannot run this topology at all - the tag is load-bearing, not incidental.
# For the Zookeeper-less variant see docker-compose.kraft.yml.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: demo-products-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: demo-products-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # So the sample runs with a single `docker compose up -d`, with no topic-creation step.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: demo-products-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 18081, not the conventional 8081: that port is taken on the development machine this sample
      # is maintained on. Only the published (host) port moves - inside the compose network Schema
      # Registry still listens on 8081, which is what Control Center and the healthcheck use.
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Confluent Control Center, in `management` mode on purpose: the broker here is `cp-kafka`, which
  # does NOT ship the Confluent Metrics Reporter jar (that lives in `cp-server`). Asking for
  # `monitoring`/`all` would just render empty throughput charts. Management mode still gives the
  # topic browser, message inspection, consumer groups and the Schema Registry view - which is all
  # this sample has to show.
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.7.1
    container_name: demo-products-control-center
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_MODE_ENABLE: management
      # Single-broker cluster: every internal topic has to drop to one replica or C3 never starts.
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_INTERNAL_TOPICS_REPLICATION: 1
      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_REPLICATION: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_STREAMS_NUM_STREAM_THREADS: 1
      PORT: 9021
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:9021/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 20
