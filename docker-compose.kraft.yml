# Zookeeper-less variant: a single Kafka 4.x broker in combined controller + broker (KRaft) mode.
#
# Publishes the same ports as docker-compose.yml, so it is a drop-in swap and needs no appsettings
# change:
#     docker compose -f docker-compose.kraft.yml up -d

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: demo-products-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: demo-products-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 18081, not the conventional 8081: that port is taken on the development machine this sample
      # is maintained on. Only the published (host) port moves - inside the compose network Schema
      # Registry still listens on 8081, which is what Control Center and the healthcheck use.
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Control Center in `management` mode: the `apache/kafka` image has no Confluent Metrics Reporter,
  # so the monitoring charts would be empty either way. Topic browser, message inspection, consumer
  # groups and the Schema Registry view all work against a plain Kafka 4.x broker.
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.7.1
    container_name: demo-products-control-center
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_MODE_ENABLE: management
      # Single-broker cluster: every internal topic has to drop to one replica or C3 never starts.
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_INTERNAL_TOPICS_REPLICATION: 1
      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_REPLICATION: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_STREAMS_NUM_STREAM_THREADS: 1
      PORT: 9021
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:9021/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 20
